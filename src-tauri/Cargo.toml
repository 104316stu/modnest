[package]
name = "modnest"
version = "0.2.6"
description = "ModNest mod manager"
edition = "2021"
default-run = "modnest"

[lib]
name = "modnest_lib"
# Desktop only. ("cdylib" is for mobile and breaks the MinGW linker on Windows.)
crate-type = ["rlib"]
# Engine tests live in ../core/tests.
test = false
doctest = false

[[bin]]
name = "modnest"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
modnest-core = { path = "../core" }
