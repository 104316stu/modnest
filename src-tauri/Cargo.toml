[package]
name = "modnest"
version = "0.1.0"
description = "ModNest mod manager"
edition = "2021"
default-run = "modnest"

[lib]
name = "modnest_lib"
# Desktop only. ("cdylib" is for mobile and breaks the MinGW linker on Windows.)
crate-type = ["rlib"]
# Tests live in tests/ (they get a Windows manifest from build.rs).
test = false
doctest = false

[[bin]]
name = "modnest"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
anyhow = "1"
url = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
