# Push a tag like v0.2.0 -> builds the Windows installer and publishes a GitHub Release.
# Installed copies of ModNest see the new release (latest.json) and update themselves.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check the update-signing key is set up
        id: key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if ($env:KEY) { "ok=true" >> $env:GITHUB_OUTPUT }
          else {
            "ok=false" >> $env:GITHUB_OUTPUT
            Write-Output "::notice::Skipped: no TAURI_SIGNING_PRIVATE_KEY secret, so this release is built and uploaded from your PC instead (see README)."
          }
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.ok == 'true'
      - uses: swatinem/rust-cache@v2
        if: steps.key.outputs.ok == 'true'
        with:
          workspaces: src-tauri
      - run: npm ci
        if: steps.key.outputs.ok == 'true'
      - uses: tauri-apps/tauri-action@v0
        if: steps.key.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ModNest ${{ github.ref_name }}"
          releaseBody: "Download the -setup.exe below. Already have ModNest? It updates itself."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
