# Push a tag like v0.2.0 -> builds the Windows installer and publishes a GitHub Release.
# Installed copies of ModNest see the new release (latest.json) and update themselves.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check the update-signing key is set up
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:KEY) {
            Write-Error "Add the repo secret TAURI_SIGNING_PRIVATE_KEY (contents of %USERPROFILE%\.tauri\modnest.key) before tagging a release. Or build and upload the release locally (see README)."
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ModNest ${{ github.ref_name }}"
          releaseBody: "Download the -setup.exe below. Already have ModNest? It updates itself."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
