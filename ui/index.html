<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ModNest</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-update" class="app-update hidden">
    <span id="app-update-text">A new version of ModNest is ready.</span>
    <button id="app-update-btn" class="btn sm">Update and restart</button>
  </div>

  <div class="shell">
    <aside class="rail" id="rail"></aside>
    <main class="main" id="main">
      <div class="center"><div class="spinner"></div><p>Looking for your Steam games…</p></div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="modal" class="modal"><form method="dialog" id="modal-body"></form></dialog>

  <script src="app.js"></script>
</body>
</html>
